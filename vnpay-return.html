<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả thanh toán VNPay | Fióre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .vnpay-result-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: var(--color-bg-primary);
        }
        .vnpay-result-card {
            max-width: 520px;
            width: 100%;
            background: var(--color-white);
            border-radius: 20px;
            border: 1px solid var(--color-border);
            padding: 36px 32px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(28, 53, 45, 0.08);
        }
        .vnpay-result-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px;
        }
        .vnpay-result-icon.success { background: rgba(82, 121, 111, 0.15); }
        .vnpay-result-icon.fail { background: rgba(185, 28, 28, 0.12); }
        .vnpay-result-icon.pending { background: rgba(180, 83, 9, 0.12); }
        .vnpay-result-card h1 {
            font-family: var(--font-display);
            font-size: 1.6rem;
            color: var(--color-brand-green);
            margin-bottom: 12px;
        }
        .vnpay-result-detail {
            font-size: 14px;
            color: var(--color-text-secondary);
            line-height: 1.7;
            margin-bottom: 24px;
        }
        .vnpay-result-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .vnpay-result-actions .btn { width: 100%; justify-content: center; }
        .vnpay-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #eeedea;
            border-top-color: var(--color-brand-green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="vnpay-result-page">
        <div class="vnpay-result-card" id="vnpayResultCard">
            <div class="vnpay-spinner" id="vnpayLoading"></div>
            <p id="vnpayStatusText">Đang xác minh thanh toán VNPay...</p>
        </div>
    </div>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="order-emails.js"></script>
    <script src="vnpay-return.js"></script>
</body>
</html>
